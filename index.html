<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3INDA HIND</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* شريط العنوان العلوي */
        .top-bar {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111;
            border-bottom: 1px solid #333;
        }

        .top-bar h1 {
            color: #d4af37;
            font-size: 22px;
            font-weight: bold;
        }

        .icons-right {
            display: flex;
            gap: 15px;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            cursor: pointer;
        }

        /* الصورة المتحركة */
        .animated-banner {
            width: 100%;
            height: 200px;
            background-image: url('https://via.placeholder.com/600x400'); /* حطي هنا رابط التصويرة ديالك */
            background-size: cover;
            background-position: center;
            animation: moveBanner 20s infinite alternate;
        }

        @keyframes moveBanner {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        /* أيقونات الأقسام */
        .categories {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 20px 10px;
            background-color: #000;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 22%; /* باش يجيو 4 فسطر واحد */
        }

        .cat-icon-bg {
            width: 50px;
            height: 50px;
            background-color: #111;
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .cat-item:hover .cat-icon-bg {
            background-color: #d4af37;
        }

        .cat-icon {
            width: 25px;
            height: 25px;
            fill: #d4af37;
        }

        .cat-item:hover .cat-icon {
            fill: #000;
        }

        .cat-name {
            font-size: 11px;
            color: #ccc;
            text-align: center;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin-top: 10px;
        }

        .product-card {
            background-color: #111;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
        }

        .product-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .product-price {
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-order {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي فيه السمية، السلة، والبحث -->
    <header class="top-bar">
        <h1>3INDA HIND</h1>
        <div class="icons-right">
            <!-- أيقونة البحث -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <!-- أيقونة السلة -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.3.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </header>

    <!-- البانر المتحرك -->
    <div class="animated-banner"></div>

    <!-- أيقونات الأقسام -->
    <div class="categories">
        <!-- قسم 1 -->
        <div class="cat-item">
            <div class="cat-icon-bg">
                <svg class="cat-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
            <span class="cat-name">أزياء</span>
        </div>
        <!-- قسم 2 -->
        <div class="cat-item">
            <div class="cat-icon-bg">
                <svg class="cat-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H9v-1h6v1zm5-3H4V6h16v9z"/></svg>
            </div>
            <span class="cat-name">إلكترونيات</span>
        </div>
        <!-- قسم 3 -->
        <div class="cat-item">
            <div class="cat-icon-bg">
                <svg class="cat-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/></svg>
            </div>
            <span class="cat-name">إكسسوارات</span>
        </div>
        <!-- قسم 4 -->
        <div class="cat-item">
            <div class="cat-icon-bg">
                <svg class="cat-icon" viewBox="0 0 24 24"><path d="M11.5 22l1.5-1.5L10 17l3-3.5-1.5-1.5L7 12l1.5 1.5L5 17l3 3.5-1.5 1.5L10 20l1.5 1.5zM12 2l-5.5 9h11L12 2z"/></svg>
            </div>
            <span class="cat-name">أطفال</span>
        </div>
    </div>

    <!-- المنتجات -->
    <main class="products-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="منتج" class="product-img">
            <div class="product-title">منتج مثال 1</div>
            <div class="product-price">100 د.م</div>
            <button class="btn-order">طلب</button>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="منتج" class="product-img">
            <div class="product-title">منتج مثال 2</div>
            <div class="product-price">200 د.م</div>
            <button class="btn-order">طلب</button>
        </div>
    </main>

</body>
</html>
